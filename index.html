<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

 <link rel="stylesheet" href="./style.css">
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<main class="card">
  <img class="card__avatar" src="./assets/images/avatar-kayleigh.jpg" alt="Portrait of Kayleigh Gomez">
  <h1 class="card__name">Kayleigh Gomez</h1>
  <p class="card__location">San Diego, California</p>
  <p class="card__bio">Certified personal trainer and outdoor fitness creator.</p>

  <ul class="card__links">
    <li><a class="card__link" href="https://github.com/lesteak11">GitHub</a></li>
    <li><a class="card__link" href="https://www.frontendmentor.io">Frontend Mentor</a></li>
    <li><a class="card__link" href="https://www.linkedin.com">LinkedIn</a></li>
    <li><a class="card__link" href="https://twitter.com">Twitter</a></li>
    <li><a class="card__link" href="https://www.instagram.com">Instagram</a></li>
  </ul>
</main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">LeSteak11</a>.
  </footer>
</body>
</html>
